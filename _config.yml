title: "xiaolu-cmd's Blog"
subtitle: 记录探索，保持好奇。
description: 网络安全学习笔记，以及一些有趣的发现。
author: xiaolu-cmd
language: zh-CN
timezone: Asia/Shanghai
url: https://xiaolu-cmd.github.io
root: /
permalink: :year/:month/:day/:title/
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - assets/**
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: true
prismjs:
  enable: false
index_generator:
  path: ''
  per_page: 10
  order_by: -date
per_page: 10
pagination_dir: page
theme: redefine
search:
  path: search.xml
  field: post
  content: true
deploy:
  type: git
  repo: https://github.com/xiaolu-cmd/xiaolu-cmd.github.io.git
  branch: master
